name: CI

on:
  pull_request:
    paths:
      - 'chat_app/**'
      - 'functions/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '.github/workflows/ci.yml'
  push:
    branches: [main, develop]
    paths:
      - 'chat_app/**'
      - 'functions/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '.github/workflows/ci.yml'

concurrency:
  group: rn-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Matches the Cloud Functions runtime (functions/package.json engines).
  NODE_VERSION: 22

jobs:
  # Lint, type check, formatting, and unit tests for the Expo app.
  # Native builds need Firebase/Maps/Stream secrets, so they are not run here.
  app:
    name: App checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: chat_app/package-lock.json

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci

  # Type check and build the Cloud Functions.
  functions:
    name: Functions build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build

  # Firestore and Storage security rules, tested against the emulators.
  rules:
    name: Security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # The Firebase emulators need Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
        working-directory: functions

      - name: Test rules
        run: >-
          npx --yes firebase-tools@15 emulators:exec --project demo-chat-app-rules
          --only firestore,storage "npm --prefix functions run test:rules"
