name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Must match the Flutter version used locally; pubspec.lock pins SDK packages
# and `--enforce-lockfile` fails if they drift.
env:
  FLUTTER_VERSION: 3.47.2

# Flutter project lives in chat_app/, not the repo root
defaults:
  run:
    working-directory: chat_app

jobs:
  # Formatting + static analysis + lockfile consistency
  format-analyze:
    name: Format & analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Fails if pubspec.lock is missing, stale, or doesn't satisfy pubspec.yaml
      - name: Verify pubspec.lock matches pubspec.yaml
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

  # Dependency review (PRs only): flags new vulnerable or
  # disallowed-license packages added via pubspec.lock
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # lets it post a summary comment
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # Optional license policy:
          # deny-licenses: GPL-3.0, AGPL-3.0

  # Android build
  build-android:
    name: Build Android
    needs: format-analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get --enforce-lockfile

      # Debug build avoids needing release signing keys in CI.
      # Switch to `flutter build appbundle --release` once signing secrets are set up.
      - name: Build APK
        run: flutter build apk --debug

  # iOS build (no code signing)
  build-ios:
    name: Build iOS
    needs: format-analyze # saves macOS minutes if formatting/analysis fails
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: chat_app/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('chat_app/ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      # `flutter build ios` runs `pod install` automatically
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign
