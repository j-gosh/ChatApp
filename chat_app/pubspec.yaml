  #flutter_local_notifications: ^18.0.1

  flutter_firebase_chat_core: ^1.6.8
  flutter_chat_ui: ^1.6.15
  flutter_chat_types: ^3.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
