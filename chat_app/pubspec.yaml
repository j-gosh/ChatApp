  riverpod_generator: ^4.0.3
  build_runner: ^2.4.13
  mocktail: ^1.0.4
  network_image_mock: ^2.1.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/json/memories.json
    - assets/json/news_articles.json
