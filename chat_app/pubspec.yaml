name: chat_app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  permission_handler: ^12.0.1

  device_info_plus: ^11.5.0

  path_provider: ^2.1.4

  shared_preferences: ^2.3.2

  camera: ^0.12.0+1

  video_player: ^2.9.2

  font_awesome_flutter: ^11.0.0

  json_annotation: ^4.11.0

  google_maps_flutter: ^2.10.0
  google_maps_flutter_android: ^2.14.11
  google_maps_flutter_platform_interface: ^2.9.5
  flutter_plugin_android_lifecycle: ^2.0.23
  geolocator: ^14.0.2

  go_router: ^17.2.0

  stream_video_flutter: ^0.10.4
  stream_video: ^0.10.4
  stream_video_push_notification: ^0.10.4

  uuid: ^4.5.1

  hooks_riverpod: ^3.3.1
